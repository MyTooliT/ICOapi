# Publish to PyPI (trusted publishing) on release tags only.
# Source: https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
name: Publish to PyPI

on:
  push:
    tags:
      - "*"

jobs:
  publish:
    name: Build and publish package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/icoapi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Build a binary wheel and a source tarball
        run: uv build
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

# PUBLIC GitHub repo: GitHub-hosted runners only.
# Never use self-hosted runners in public repos: pull requests from forks
# would execute arbitrary code on the runner machines.
name: Check & Test Code

on:
  - push
  - pull_request

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: taiki-e/install-action@just
      - name: Check and test code base
        run: just test

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
authors = [
  {name = "Moritz Breurather", email = "breurather@ift.at"},
  {name = "René Schwaiger", email = "rene.schwaiger@ift.at"},
]

dependencies = [
  "colorlog>=6.9.0,<7",
  "fastapi>=0.115.7",
  "icostate>=0.26.0,<2",
  "icolyzer>=1.8.0",
  "icoschema>=0.4.1,<1",
  "orjson>=3.11.0",
  "paho-mqtt>=2.1.0,<3",
  "pandas>=3.0.3,<4",
  "pathvalidate>=3.3.1,<4",
  "psutil>=6.0.0,<8",
  "python-dotenv>=1.0.1,<2",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0.1,<7",
  "requests>=2.32.0,<3",
  "uvicorn[standard]>=0.35.0",
  "types-pyyaml (>=6.0.12.20250915,<7.0.0.0)",
]
description = """A REST and WebSocket API for the ICOtronic system using the \
                 Python FastAPI library"""
keywords = [
  "smart-tool",
  "smh",
  "stu",
  "sth",
  "tool-holder",
]
name = "icoapi"
readme = "README.md"
requires-python = ">=3.13,<4"
version = "0.3.1"

[project.optional-dependencies]
dev = [
  "mypy>=2.1.0",
  "ruff>=0.17.4",
  "myst-parser>=5",
  "sphinx>=9.1.0,<10",
  "sphinxcontrib.openapi>= 0.9.0",
  "sphinx-pyproject>=0.3",
  "sphinx_rtd_theme",
  "types-requests",
  "pyinstaller>=6.22.1",
]
test = [
  "anyio>=4.12.0",
  "httpx>=0.28.1",
  "httpx-ws>=0.8.2",
  # Starlette's test client deprecates httpx in favour of httpx2
  "httpx2>=2.16.2",
  "pytest>=9.0.2",
  "pytest-rerunfailures>=16.1",
  "pytest-sugar>=1.1.1",
]

[project.scripts]
icoapi = "icoapi.api:main"

[tool.ruff]
line-length = 79

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "B",       # bugbear
  "UP",      # pyupgrade
  "SIM",     # simplify
  "C90",     # complexity
  "PL",      # pylint rules
  "RUF",
]
ignore = [
  "E501",    # line length is handled by the formatter
  "PLR0913", # too many arguments
  "PLR2004", # magic values
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Sphinx injects `html_theme` etc. via sphinx-pyproject
"doc/**/conf.py" = ["F821"]
# FastAPI injects dependencies through call expressions in default arguments
"icoapi/routers/**" = ["B008"]
# Tests import lazily (after the environment is set up) and use fixtures
"test/**" = ["PLR0915", "S101", "PLC0415", "PLR0917"]

[tool.mypy]
ignore_missing_imports = true
# Local PyInstaller output contains duplicate module names
exclude = ["^build/", "^dist/", "^\\.venv/"]

[tool.pytest]
addopts = [
  "--doctest-modules",
  "--verbose",
]
anyio_mode = "auto"
markers = [
    """hardware: marks tests as depending on ICOtronic hardware \
       (deselect with '-m "not hardware"')""",
    "hardware",
    """mqtt: marks tests that need an MQTT broker \
       (set TEST_MQTT_BROKER; deselect with '-m "not mqtt"')""",
    "mqtt",
]
testpaths = [
  "test"
]
